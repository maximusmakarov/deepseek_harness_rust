[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0441", reason = "pin-utils is pulled only by the dev-only expectrl/nix TUI test harness; it is not linked into the shipped dshr binary" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
