[package]
name = "dshr-cli"
description = "dshr command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dshr"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
clap.workspace = true
dshr-agent.workspace = true
dshr-compaction.workspace = true
dshr-browser.workspace = true
dshr-config.workspace = true
dshr-core.workspace = true
dshr-jobs.workspace = true
dshr-lsp.workspace = true
dshr-llm.workspace = true
dshr-llm-deepseek.workspace = true
dshr-llm-mock.workspace = true
dshr-llm-openai.workspace = true
dshr-mcp.workspace = true
dshr-office.workspace = true
dshr-prompt.workspace = true
dshr-sandbox.workspace = true
dshr-schedule.workspace = true
dshr-server.workspace = true
chrono.workspace = true
dshr-session.workspace = true
dshr-skills.workspace = true
dshr-session-jsonl.workspace = true
dshr-tools.workspace = true
dshr-team.workspace = true
dshr-tui.workspace = true
dshr-workflow.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"
seccompiler = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
sandboxrs-windows = "=0.1.1"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
expectrl = "0.9"
