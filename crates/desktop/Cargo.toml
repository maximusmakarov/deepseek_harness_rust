[package]
name = "dshr-desktop"
description = "Thin Tauri desktop shell over dshr serve"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "webview-data-url"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "dshr-desktop"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"

[workspace]
