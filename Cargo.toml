[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/config",
    "crates/llm",
    "crates/llm-deepseek",
    "crates/llm-openai",
    "crates/llm-mock",
    "crates/session",
    "crates/session-jsonl",
    "crates/tools",
    "crates/prompt",
    "crates/skills",
    "crates/mcp",
    "crates/jobs",
    "crates/sandbox",
    "crates/server",
    "crates/workflow",
    "crates/compaction",
    "crates/agent",
    "crates/tui",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dshr-core = { path = "crates/core" }
dshr-config = { path = "crates/config" }
dshr-llm = { path = "crates/llm" }
dshr-llm-deepseek = { path = "crates/llm-deepseek" }
dshr-llm-openai = { path = "crates/llm-openai" }
dshr-llm-mock = { path = "crates/llm-mock" }
dshr-session = { path = "crates/session" }
dshr-session-jsonl = { path = "crates/session-jsonl" }
dshr-tools = { path = "crates/tools" }
dshr-prompt = { path = "crates/prompt" }
dshr-skills = { path = "crates/skills" }
dshr-mcp = { path = "crates/mcp" }
dshr-jobs = { path = "crates/jobs" }
dshr-sandbox = { path = "crates/sandbox" }
dshr-server = { path = "crates/server" }
dshr-workflow = { path = "crates/workflow" }
dshr-compaction = { path = "crates/compaction" }
dshr-agent = { path = "crates/agent" }
dshr-tui = { path = "crates/tui" }

clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
async-trait = "0.1"
async-stream = "0.3"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util", "net", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }

assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = "line-tables-only"
