[workspace]
resolver = "3"
members = ["crates/core", "crates/config", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dshr-core = { path = "crates/core" }
dshr-config = { path = "crates/config" }

clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v7"] }

assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = "line-tables-only"
