name: Windows sandbox verify

on:
  push:
    branches: [verify/windows-sandbox]

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DSHR_WINDOWS_SANDBOX: "1"
      DSHR_SANDBOX_SETUP_TIMEOUT_SECS: "300"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: force rebuild
        shell: bash
        run: |
          touch crates/cli/src/sandbox_exec/windows.rs crates/cli/tests/windows_sandbox.rs
          cargo clean -p dshr-cli
      - name: sandbox wrapper test
        shell: bash
        run: cargo test -p dshr-sandbox -- --ignored --nocapture
      - name: runtime AppContainer test
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test -p dshr-cli --test windows_sandbox -- --ignored --nocapture 2>&1 | tee windows-test.log
      - name: publish log
        if: always()
        shell: bash
        run: |
          git config user.name "dshr-ci"
          git config user.email "dshr-ci@localhost"
          git checkout -B ci-log
          git add windows-test.log
          git commit -m "ci: windows sandbox test log" || true
          git push origin ci-log
