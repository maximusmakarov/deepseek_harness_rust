name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "0"
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/dshr --remap-path-prefix=${{ github.workspace }}/target=/target -C debuginfo=0"

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: dshr
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: dshr
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: dshr
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: dshr
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: dshr.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cross
        if: matrix.cross
      - name: build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked -p dshr-cli --target ${{ matrix.target }}
          else
            cargo build --release --locked -p dshr-cli --target ${{ matrix.target }}
          fi
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-release.sh "$version" "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/${{ matrix.bin }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: desktop (macos)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: package app
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-desktop.sh "$version"
          ditto -c -k --keepParent dist/dshr.app "dist/dshr-$version-macos.zip"
          shasum -a 256 "dist/dshr-$version-macos.zip" > "dist/dshr-$version-macos.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-macos
          path: dist/*.zip*
          if-no-files-found: error

  desktop-linux:
    name: desktop (linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: webkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: build
        run: |
          cargo build --release --locked -p dshr-cli
          CARGO_TARGET_DIR=target cargo build --release --manifest-path crates/desktop/Cargo.toml
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="dshr-$version-linux-desktop"
          mkdir -p "dist/stage/$name"
          cp target/release/dshr target/release/dshr-desktop "dist/stage/$name/"
          tar -C dist/stage -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-linux
          path: dist/*.tar.gz*
          if-no-files-found: error

  desktop-windows:
    name: desktop (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p dshr-cli
          CARGO_TARGET_DIR=target cargo build --release --manifest-path crates/desktop/Cargo.toml
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="dshr-$version-windows-desktop"
          mkdir -p "dist/stage/$name"
          cp target/release/dshr.exe target/release/dshr-desktop.exe "dist/stage/$name/"
          (cd dist/stage && tar -a -c -f "../$name.zip" "$name")
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-windows
          path: dist/*.zip*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, desktop, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DSHR_RELEASE_KEY: ${{ secrets.DSHR_RELEASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: combine checksums
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 | sort -k2 > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: sign checksums
        if: env.DSHR_RELEASE_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="dshr-$version-x86_64-unknown-linux-gnu"
          mkdir -p bootstrap
          tar -xzf "dist/$name.tar.gz" -C bootstrap
          binary="bootstrap/$name/dshr"
          "$binary" release sign dist/SHA256SUMS --out dist/SHA256SUMS.sig
          "$binary" release public-key > dist/SHA256SUMS.pub
          cat dist/SHA256SUMS.pub
      - name: render binary formula
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/render-formula.sh "$version" dist/SHA256SUMS dist/dshr.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pub
            dist/dshr.rb
          fail_on_unmatched_files: false
