name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "0"
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/dshr --remap-path-prefix=${{ github.workspace }}/target=/target -C debuginfo=0"

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: dshr
            bottle: x86_64_linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: dshr
            bottle: aarch64_linux
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: dshr
            bottle: arm64_sequoia
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: dshr
            bottle: sonoma
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: dshr.exe
            bottle: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cross
        if: matrix.cross
      - name: build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked -p dshr-cli --target ${{ matrix.target }}
          else
            cargo build --release --locked -p dshr-cli --target ${{ matrix.target }}
          fi
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-release.sh "$version" "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [ -n "${{ matrix.bottle }}" ]; then
            scripts/package-bottle.sh "$version" "${{ matrix.bottle }}" \
              "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          fi
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: desktop (macos)
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      DSHR_CODESIGN_IDENTITY: ${{ secrets.DSHR_CODESIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k actions build.keychain >/dev/null
          security list-keychains -d user -s build.keychain
      - name: package app
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-desktop.sh "$version"
      - name: notarize
        if: env.APPLE_ID != '' && env.DSHR_CODESIGN_IDENTITY != ''
        shell: bash
        run: scripts/notarize-app.sh dist/dshr.app
      - name: package artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent dist/dshr.app "dist/dshr-$version-macos.zip"
          shasum -a 256 "dist/dshr-$version-macos.zip" > "dist/dshr-$version-macos.zip.sha256"
          scripts/package-dmg.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-macos
          path: |
            dist/*.zip*
            dist/*.dmg*
          if-no-files-found: error

  desktop-linux:
    name: desktop (linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: webkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: build
        run: |
          cargo build --release --locked -p dshr-cli
          CARGO_TARGET_DIR=target cargo build --release --manifest-path crates/desktop/Cargo.toml
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="dshr-$version-linux-desktop"
          mkdir -p "dist/stage/$name"
          cp target/release/dshr target/release/dshr-desktop "dist/stage/$name/"
          tar -C dist/stage -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-linux
          path: dist/*.tar.gz*
          if-no-files-found: error

  desktop-windows:
    name: desktop (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p dshr-cli
          CARGO_TARGET_DIR=target cargo build --release --manifest-path crates/desktop/Cargo.toml
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="dshr-$version-windows-desktop"
          mkdir -p "dist/stage/$name"
          cp target/release/dshr.exe target/release/dshr-desktop.exe "dist/stage/$name/"
          (cd dist/stage && tar -a -c -f "../$name.zip" "$name")
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-windows
          path: dist/*.zip*
          if-no-files-found: error

  bottles-ghcr:
    name: bottles (ghcr)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: push OCI bottles
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          shopt -s nullglob
          for bottle in dist/*.bottle.tar.gz; do
            name="$(basename "$bottle")"
            tag="${name#dshr--$version.}"
            tag="${tag%.bottle.tar.gz}"
            python3 scripts/publish-bottle-ghcr.py --version "$version" --tag "$tag" \
              --bottle "$bottle" --owner "$owner" --repo "$repo" --push
          done

  publish:
    name: publish release
    needs: [build, desktop, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DSHR_RELEASE_KEY: ${{ secrets.DSHR_RELEASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: combine checksums
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 | sort -k2 > dist/SHA256SUMS
          cat dist/SHA256SUMS
          if ls dist/bottles-* >/dev/null 2>&1; then
            cat dist/bottles-* > dist/BOTTLES
          fi
      - name: sign checksums
        if: env.DSHR_RELEASE_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="dshr-$version-x86_64-unknown-linux-gnu"
          mkdir -p bootstrap
          tar -xzf "dist/$name.tar.gz" -C bootstrap
          binary="bootstrap/$name/dshr"
          "$binary" release sign dist/SHA256SUMS --out dist/SHA256SUMS.sig
          "$binary" release public-key > dist/SHA256SUMS.pub
          cat dist/SHA256SUMS.pub
      - name: render binary formula
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -s dist/BOTTLES ]; then
            BOTTLES_FILE=dist/BOTTLES scripts/render-formula.sh \
              "$version" dist/SHA256SUMS dist/dshr.rb
            BOTTLES_FILE=dist/BOTTLES BOTTLE_ROOT_URL="https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}" \
              scripts/render-formula.sh "$version" dist/SHA256SUMS dist/dshr-ghcr.rb
          else
            scripts/render-formula.sh "$version" dist/SHA256SUMS dist/dshr.rb
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.bottle.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pub
            dist/dshr.rb
            dist/dshr-ghcr.rb
          fail_on_unmatched_files: false
