name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: dshr
          - os: macos-latest
            bin: dshr
          - os: windows-latest
            bin: dshr.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p dshr-cli
      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/${{ matrix.bin }}
