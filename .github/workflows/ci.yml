name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: clippy diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f clippy.log ]; then
            wc -l clippy.log
            grep -iE "error|warning" clippy.log | tail -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: clippy-log
          path: clippy.log
      - uses: taiki-e/install-action@nextest
      - name: nextest
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --workspace --no-fail-fast 2>&1 | tee nextest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Nextest failures"
              echo '```'
              grep -a -E "FAIL|failures:|panicked|error\[|Error:" nextest.log | tail -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -a -E "FAIL|panicked|assertion|Error:" nextest.log | head -30 | while IFS= read -r line; do
              echo "::error title=nextest::${line}"
            done
          fi
          exit "$status"
      - name: nextest diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f nextest.log ]; then
            grep -a -E "FAIL|failures:|panicked|assertion|Error:" nextest.log               | sed 's/\x1b\[[0-9;]*m//g'               | head -80               | while IFS= read -r line; do
                  echo "::error title=nextest::${line}"
                done
          else
            echo "::error title=nextest::nextest.log is missing"
          fi
      - name: release tooling smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bottles
          scripts/package-bottle.sh 0.0.0 x86_64_linux target/debug/dshr /tmp/bottles
          python3 scripts/test-publish-bottle-ghcr.py /tmp/bottles/*.bottle.tar.gz 0.0.0 x86_64_linux

      - name: windows sandbox (AppContainer)
        if: runner.os == 'Windows'
        shell: bash
        env:
          DSHR_WINDOWS_SANDBOX: "1"
          DSHR_SANDBOX_SETUP_TIMEOUT_SECS: "300"
        run: |
          cargo test -p dshr-sandbox -- --ignored
          cargo test -p dshr-cli --test windows_sandbox -- --ignored
      - run: cargo test --workspace --doc
      - name: desktop check
        if: matrix.os == 'macos-latest'
        run: cargo test --manifest-path crates/desktop/Cargo.toml

  evals:
    name: evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: eval suite (10 tasks, success + cost budgets)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p dshr-cli --test evals -- --nocapture 2>&1 | tee evals.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            target/evals/report.json
            evals.log
          if-no-files-found: ignore

  web-e2e:
    name: web e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p dshr-cli
      - name: chat -> approval -> tool -> journal in headless Chrome
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/web-e2e.py --binary target/debug/dshr 2>&1 | tee web-e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-log
          path: web-e2e.log
          if-no-files-found: ignore

  perf:
    name: perf budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ARCHITECTURE §20 budgets
        shell: bash
        run: |
          set -o pipefail
          cargo test -p dshr-perf --release -- --nocapture 2>&1 | tee perf.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Performance budget regressions"
              echo '```'
              grep -a -E "^(PASS|FAIL|SKIP)" perf.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --summary-only
